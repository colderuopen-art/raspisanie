<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Расписание занятий — ЕЭТ</title>
<script src="xlsx.full.min.js"></script>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --text: #17324f;
    --muted: #8a948f;
    --accent: #2e7de0;
    --navy: #17324f;
    --orange: #e8542a;
    --border: #e4eae6;
    /* Масштаб таблицы заочников (управляется из JS) */
    --zach-scale: 1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  .wrap.wide { max-width: 100%; }

  header.brand {
    background: var(--card); text-align: center;
    padding: 0 0 20px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  header.brand .stripe {
    height: 5px;
    background: linear-gradient(90deg, #2e7de0 0%, #2e9e4f 55%, #e8542a 100%);
  }
  header.brand img.logo {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--border); margin-top: 18px;
  }
  header.brand h1 { font-size: 21px; font-weight: 700; margin-top: 10px; }
  header.brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  header.brand #fileInfo { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .view { display: none; animation: fade .18s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-btn {
    border: 1px solid var(--border); border-top: 3px solid var(--accent);
    background: var(--card); border-radius: 14px; padding: 16px 14px;
    text-align: left; cursor: pointer; font-size: 16px; font-weight: 600;
    color: var(--text); transition: transform .1s ease, box-shadow .1s ease;
  }
  .day-btn:active { transform: scale(.97); }
  @media (hover: hover) { .day-btn:hover { box-shadow: 0 2px 10px rgba(23,50,79,.10); } }
  .day-btn small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .day-btn.wide { grid-column: 1 / -1; text-align: center; }
  .day-btn.bells { background: #ddeafa; }
  .day-btn.zach  { background: #fdece3; border-top-color: var(--orange); }

  .topbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 14px; }
  .back {
    border: none; background: var(--accent); border-radius: 12px;
    width: 42px; height: 42px; font-size: 20px; font-weight: 700;
    cursor: pointer; color: #fff; flex: 0 0 42px;
    box-shadow: 0 2px 8px rgba(46,125,224,.35);
  }
  @media (hover: hover) { .back:hover { background: #1f6fd0; } }
  .topbar .title h2 { font-size: 18px; font-weight: 700; }
  .topbar .title span { font-size: 13px; color: var(--muted); }

  .tbl-wrap {
    overflow: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    max-height: calc(100vh - 190px);
  }
  table { border-collapse: separate; border-spacing: 0; min-width: 640px; width: 100%; font-size: 14px; }
  th, td {
    padding: 10px 12px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  th:last-child, td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  td.grp, th.grp {
    position: sticky; left: 0; z-index: 1;
    background: var(--card); font-weight: 600; white-space: nowrap;
  }
  thead th.grp { z-index: 3; background: var(--navy); }
  td.muted { color: var(--muted); }
  @media (hover: hover) { tbody tr:hover td, tbody tr:hover td.grp { background: #f2f7fd; } }

  .bells-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; text-align: center;
  }
  .bells-card img { max-width: 100%; height: auto; border-radius: 8px; }

  .msg { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ======== Таблица заочников ========
     ВАЖНО: размеры внутри таблицы считаются через calc(... * --zach-scale),
     поэтому sticky работает корректно при любом масштабе. transform НЕ
     используется (кроме кнопок и fade), иначе sticky начинает "плыть".
  */
  .zach-scroll {
    overflow: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    max-height: calc(100vh - 190px);
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-x pan-y;
    scrollbar-width: none;
    position: relative;
  }
  .zach-scroll::-webkit-scrollbar { display: none; }

  .zach-wrap {
    /* больше НЕ transform-origin — обычный layout */
    width: 100%;
  }
  .zach-wrap table {
    border-collapse: separate; border-spacing: 0;
    width: max-content; min-width: 100%;
    /* базовый размер шрифта × масштаб */
    font-size: calc(13px * var(--zach-scale));
  }
  .zach-wrap th, .zach-wrap td {
    /* отступы тоже зависят от масштаба */
    padding: calc(7px * var(--zach-scale)) calc(10px * var(--zach-scale));
    vertical-align: top;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word;
    background: var(--card);
  }
  .zach-wrap th:last-child, .zach-wrap td:last-child { border-right: none; }

  /* Высота липкой шапки тоже зависит от масштаба.
     По умолчанию: строки ~14px шрифт, padding 7+7 → около 34px.
     --title-h считаем как функция масштаба. */
  .zach-wrap {
    --title-h: calc(34px * var(--zach-scale));
  }
  .zach-wrap tr.group-title td {
    position: sticky; top: 0; z-index: 6;
    background: #eaf1fa; color: var(--navy);
    font-weight: 700;
    font-size: calc(14px * var(--zach-scale));
    border-top: 2px solid var(--navy);
    border-bottom: 1px solid var(--navy);
  }
  .zach-wrap tr.header-row td {
    position: sticky; top: var(--title-h); z-index: 5;
    background: var(--navy); color: #fff;
    font-weight: 700;
    font-size: calc(12px * var(--zach-scale));
    white-space: nowrap;
  }
  .zach-wrap tr.day-row td {
    background: #eef4fb; color: var(--navy); font-weight: 700;
  }
  .zach-wrap tr.date-row td {
    background: #f7fafc; color: var(--muted);
    font-size: calc(12px * var(--zach-scale));
  }
  .zach-wrap tr.empty-row td {
    background: transparent; border: none;
    padding: calc(6px * var(--zach-scale)) 0;
  }

  /* Индикатор масштаба */
  .zach-zoom-badge {
    position: fixed; left: 50%; bottom: 70px;
    transform: translateX(-50%);
    background: rgba(23, 50, 79, 0.85);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 20px;
    pointer-events: none;
    opacity: 0; transition: opacity .15s ease;
    z-index: 900;
  }
  .zach-zoom-badge.show { opacity: 1; }

  /* Горизонтальный скроллбар снизу */
  .zach-hbar {
    position: sticky; bottom: 0; left: 0;
    margin-top: 8px; height: 18px;
    background: rgba(244, 247, 245, 0.95);
    border-top: 1px solid var(--border);
    border-radius: 0 0 14px 14px;
    z-index: 7;
    display: flex; align-items: center;
  }
  .zach-hbar .track {
    flex: 1; height: 8px; margin: 0 12px;
    background: #e4eae6; border-radius: 6px;
    position: relative; overflow: hidden;
  }
  .zach-hbar .thumb {
    position: absolute; top: 0; left: 0;
    height: 100%; width: 40%;
    background: #9aa5a0; border-radius: 6px;
    cursor: grab;
    transition: background .12s;
  }
  .zach-hbar .thumb:active { cursor: grabbing; background: #6f7c76; }
  @media (hover: hover) { .zach-hbar .thumb:hover { background: #7b877f; } }

  @media (min-width: 720px) {
    .wrap { max-width: 900px; padding: 0 24px 48px; }
    .wrap.wide { max-width: 1200px; }
    header.brand h1 { font-size: 26px; }
    header.brand img.logo { width: 92px; height: 92px; }
    .days { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .day-btn { padding: 20px 18px; }
    .topbar .title h2 { font-size: 22px; }
    table { font-size: 15px; }
    .zach-wrap { --title-h: calc(36px * var(--zach-scale)); }
  }
  @media (min-width: 1100px) {
    .wrap { max-width: 1060px; }
    .wrap.wide { max-width: 1400px; }
    .days { grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .day-btn { padding: 16px 12px; font-size: 15px; text-align: center; }
  }
</style>
</head>
<body>

<header class="brand">
  <div class="stripe"></div>
  <img class="logo" src="logo.png" alt="ЕЭТ">
  <h1>Расписание занятий</h1>
  <p class="sub">Екатеринбургский энергетический техникум</p>
  <p id="fileInfo">загрузка…</p>
</header>

<div class="wrap" id="wrap">

  <section id="view-days" class="view active">
    <div class="days" id="days"></div>
  </section>

  <section id="view-table" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2 id="tblDay"></h2><span id="tblDate"></span></div>
    </div>
    <div id="tableBox"></div>
  </section>

  <section id="view-bells" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание звонков</h2><span>время начала и конца пар</span></div>
    </div>
    <div class="bells-card">
      <img id="bellsImg" alt="Расписание звонков"
           onerror="this.style.display='none';document.getElementById('bellsErr').style.display='block';">
      <div class="msg" id="bellsErr" style="display:none">Файл Звонки.jpg не найден рядом с сайтом</div>
    </div>
  </section>

  <section id="view-zach" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание заочное обучение</h2><span>по файлу зо.xlsx</span></div>
    </div>
    <div id="zachTableBox"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

<div class="zach-zoom-badge" id="zachZoomBadge">100%</div>

<script>
/* ============ настройки ============ */
const XLSX_FILE  = "Расписание.xlsx";
const BELLS_FILE = "Звонки.jpg";
const ZACH_FILE  = "зо.xlsx";

const DAYS = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА"];
const DAYS_RU = {
  "ПОНЕДЕЛЬНИК": "Понедельник", "ВТОРНИК": "Вторник", "СРЕДА": "Среда",
  "ЧЕТВЕРГ": "Четверг", "ПЯТНИЦА": "Пятница", "СУББОТА": "Суббота"
};
const WEEK_ORDER = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА","ВОСКРЕСЕНЬЕ"];

let schedule = {};
let zachSheets = [];

/* ============ утилиты ============ */
function fmtDate(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function cellToString(v) {
  if (v == null) return "";
  if (v instanceof Date && !isNaN(v)) return fmtDate(v);
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}.${m[2]}.${m[1]}`;
  return s;
}
function isDayRow(row) {
  const vals = row.map(cellToString).filter(Boolean);
  if (!vals.length) return false;
  return vals.every(v => WEEK_ORDER.includes(v.toUpperCase()));
}
function isDateRow(row) {
  const vals = row.map(cellToString).filter(Boolean);
  if (!vals.length) return false;
  return vals.every(v => /^\d{2}\.\d{2}\.\d{4}$/.test(v));
}
function isGroupTitleRow(row) {
  const vals = row.map(cellToString).filter(Boolean);
  if (!vals.length) return false;
  return /^Расписание занятий заочного отделения/i.test(vals[0]);
}
function isHeaderRow(row) {
  const vals = row.map(cellToString).filter(Boolean).map(v => v.toLowerCase());
  return vals.includes("№") && vals.some(v => /день недели/.test(v));
}

/* ============ загрузка очников ============ */
async function loadFile() {
  const resp = await fetch(encodeURI(XLSX_FILE) + "?v=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("не найден файл " + XLSX_FILE);
  const lastMod = resp.headers.get("Last-Modified");
  const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

  for (const sheetName of wb.SheetNames) {
    const day = sheetName.trim().toUpperCase();
    if (day === "ИТОГ" || !DAYS.includes(day)) continue;

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
    let date = "";
    for (const v of (rows[0] || [])) {
      if (v instanceof Date && !isNaN(v)) { date = fmtDate(v); break; }
    }
    const hdr = rows[1] || [];
    const pairs = [];
    for (let c = 1; c < hdr.length; c++) {
      const h = String(hdr[c]).trim();
      if (!h) break;
      pairs.push(h);
    }
    const data = [];
    for (let r = 2; r < rows.length; r++) {
      const g = String(rows[r][0] ?? "").trim();
      if (!g) continue;
      const row = [g];
      for (let c = 1; c <= pairs.length; c++) row.push(String(rows[r][c] ?? "").trim());
      data.push(row);
    }
    schedule[day] = { date, pairs, rows: data };
  }

  const upd = lastMod ? new Date(lastMod) : null;
  document.getElementById("fileInfo").textContent = upd ? "Обновление " + fmtDate(upd) : "";
}

/* ============ загрузка заочников ============ */
async function loadZachFile() {
  zachSheets = [];
  try {
    const resp = await fetch(encodeURI(ZACH_FILE) + "?v=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("не найден файл " + ZACH_FILE);
    const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

    for (const sheetName of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });
      while (rows.length && rows[rows.length - 1].every(v => String(v || "").trim() === "")) {
        rows.pop();
      }
      if (rows.length) zachSheets.push({ name: sheetName, rows });
    }
  } catch (e) {
    console.error(e);
    zachSheets = [{ name: "Ошибка", rows: [[`Не удалось загрузить ${ZACH_FILE}`]] }];
  }
}

/* ============ навигация ============ */
const inMax = typeof window.WebApp !== "undefined" && window.WebApp;
if (inMax) {
  WebApp.ready();
  WebApp.BackButton.onClick(() => {
    const active = document.querySelector(".view.active").id;
    if (active === "view-table" || active === "view-bells" || active === "view-zach") showDays();
    else WebApp.close();
  });
}
function syncBackButton() {
  if (!inMax) return;
  const active = document.querySelector(".view.active").id;
  if (active === "view-days") WebApp.BackButton.hide();
  else WebApp.BackButton.show();
}
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  const wideViews = ["view-table", "view-zach"];
  document.getElementById("wrap").classList.toggle("wide", wideViews.includes(id));
  window.scrollTo(0, 0);
  syncBackButton();
}

/* ============ экран дней ============ */
function renderDays() {
  const box = document.getElementById("days");
  box.innerHTML = "";
  DAYS.forEach(day => {
    const d = schedule[day];
    const b = document.createElement("button");
    b.className = "day-btn";
    b.innerHTML = DAYS_RU[day] +
      `<small>${d ? (d.date || "дата не указана") : "нет данных"}</small>`;
    b.onclick = () => showTable(day);
    box.appendChild(b);
  });

  const bells = document.createElement("button");
  bells.className = "day-btn bells wide";
  bells.innerHTML = "Расписание звонков<small>время начала и конца пар</small>";
  bells.onclick = showBells;
  box.appendChild(bells);

  const zach = document.createElement("button");
  zach.className = "day-btn zach wide";
  zach.innerHTML = "Расписание заочное обучение<small>сессии по группам заочного отделения</small>";
  zach.onclick = showZach;
  box.appendChild(zach);
}

/* ============ таблица дня (очники) ============ */
function showTable(day) {
  const d = schedule[day];
  document.getElementById("tblDay").textContent = DAYS_RU[day];
  document.getElementById("tblDate").textContent =
    d && d.date ? "Расписание от " + d.date : "Дата в файле не указана";

  if (!d || !d.rows.length) {
    document.getElementById("tableBox").innerHTML = `<div class="msg">Нет данных на этот день</div>`;
    show("view-table");
    return;
  }
  const pairs = d.pairs.length ? d.pairs : ["Занятия"];
  let html = '<div class="tbl-wrap"><table><thead><tr><th class="grp">Группа</th>';
  pairs.forEach(p => { html += `<th>${esc(p)}</th>`; });
  html += "</tr></thead><tbody>";
  d.rows.forEach(r => {
    html += `<tr><td class="grp">${esc(r[0])}</td>`;
    for (let i = 0; i < pairs.length; i++) {
      const s = d.pairs.length ? (r[i + 1] || "") : "";
      const muted = /САМОСТОЯТЕЛЬН/i.test(s) || !s;
      html += `<td${muted ? ' class="muted"' : ""}>${s ? esc(s) : "—"}</td>`;
    }
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  document.getElementById("tableBox").innerHTML = html;
  show("view-table");
}

/* ============ звонки ============ */
function showBells() {
  const img = document.getElementById("bellsImg");
  document.getElementById("bellsErr").style.display = "none";
  img.style.display = "";
  img.src = encodeURI(BELLS_FILE) + "?v=" + Date.now();
  show("view-bells");
}

/* ============ ЗАОЧНИКИ: pinch-to-zoom с шагом 5%, БЕЗ transform ============
   Масштаб применяется через CSS-переменную --zach-scale, которая влияет на
   размеры шрифтов, паддингов и высоту шапки. Sticky-шапки при этом работают
   корректно, потому что layout пересчитывается честно.
*/
const ZOOM_STEP = 0.05;
const ZOOM_MIN  = 0.5;
const ZOOM_MAX  = 3;

function setupZachPinch() {
  const scroll = document.querySelector(".zach-scroll");
  const wrap   = document.querySelector(".zach-wrap");
  const hbar   = document.querySelector(".zach-hbar");
  const track  = hbar ? hbar.querySelector(".track") : null;
  const thumb  = hbar ? hbar.querySelector(".thumb") : null;
  const badge  = document.getElementById("zachZoomBadge");
  const root   = document.documentElement;
  if (!scroll || !wrap) return;

  let scale = 1;

  function apply() {
    // ключевая строка — меняем масштаб через CSS-переменную
    root.style.setProperty("--zach-scale", scale);
    updateHBar();
  }

  let badgeTimer = null;
  function showBadge() {
    if (!badge) return;
    badge.textContent = Math.round(scale * 100) + "%";
    badge.classList.add("show");
    if (badgeTimer) clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => badge.classList.remove("show"), 900);
  }

  function updateHBar() {
    if (!track || !thumb || !hbar) return;
    const cw = scroll.clientWidth;
    const contentW = wrap.scrollWidth;
    if (contentW <= cw + 1) {
      hbar.style.display = "none";
      return;
    }
    hbar.style.display = "flex";
    const ratio = cw / contentW;
    const thumbW = Math.max(30, track.clientWidth * ratio);
    thumb.style.width = thumbW + "px";
    const maxContentX = contentW - cw;
    const x = maxContentX > 0 ? Math.min(1, Math.max(0, scroll.scrollLeft / maxContentX)) : 0;
    const maxThumbX = track.clientWidth - thumbW;
    thumb.style.transform = `translateX(${x * maxThumbX}px)`;
  }

  /* Меняем масштаб дискретно по 5% с якорем в точке (px, py) относительно
     контента scroll-контейнера. Из-за того что мы меняем layout, а не
     transform, приходится после изменения корректировать scrollLeft/scrollTop,
     чтобы визуально точка под пальцами осталась на месте. */
  function setScale(newScale, anchorClientX, anchorClientY) {
    newScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newScale));
    newScale = Math.round(newScale / ZOOM_STEP) * ZOOM_STEP;
    newScale = Math.round(newScale * 100) / 100;
    if (newScale === scale) return;

    // Координаты якоря ДО изменения — относительно содержимого (scrollLeft + offset)
    const rect = scroll.getBoundingClientRect();
    const localX = anchorClientX - rect.left + scroll.scrollLeft;
    const localY = anchorClientY - rect.top  + scroll.scrollTop;

    // Доля якоря в текущем контенте
    const contentW = wrap.scrollWidth;
    const contentH = wrap.scrollHeight;
    const fracX = contentW > 0 ? localX / contentW : 0;
    const fracY = contentH > 0 ? localY / contentH : 0;

    // Применяем новый масштаб
    scale = newScale;
    apply();

    // После пересчёта layout: сохраняем ту же "долю" под пальцами
    requestAnimationFrame(() => {
      const newW = wrap.scrollWidth;
      const newH = wrap.scrollHeight;
      const targetX = newW * fracX;
      const targetY = newH * fracY;
      scroll.scrollLeft = targetX - (anchorClientX - rect.left);
      scroll.scrollTop  = targetY - (anchorClientY - rect.top);
      updateHBar();
    });

    showBadge();
  }

  // ---------- pinch пальцами ----------
  let startDist = 0, startScale = 1;
  let startMid = { x: 0, y: 0 };
  let pinchActive = false;

  function midPoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }
  function distance(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  scroll.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      pinchActive = true;
      startDist = distance(e.touches[0], e.touches[1]);
      startScale = scale;
      startMid = midPoint(e.touches[0], e.touches[1]);
      e.preventDefault();
    }
  }, { passive: false });

  scroll.addEventListener("touchmove", (e) => {
    if (!pinchActive || e.touches.length !== 2) return;
    const d = distance(e.touches[0], e.touches[1]);
    if (!startDist) return;

    const rawRatio = d / startDist;
    const desired = startScale * rawRatio;
    const steps = Math.round((desired - startScale) / ZOOM_STEP);
    const target = startScale + steps * ZOOM_STEP;
    // применим только если реально изменился масштаб
    if (Math.abs(target - scale) >= ZOOM_STEP / 2) {
      setScale(target, startMid.x, startMid.y);
    }
    e.preventDefault();
  }, { passive: false });

  function endPinch(e) {
    if (e.touches.length < 2) {
      pinchActive = false;
      startDist = 0;
    }
  }
  scroll.addEventListener("touchend", endPinch);
  scroll.addEventListener("touchcancel", endPinch);

  // ---------- Ctrl+колесо мыши ----------
  scroll.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    setScale(scale + dir * ZOOM_STEP, e.clientX, e.clientY);
  }, { passive: false });

  // ---------- скролл-бар: синхронизация ----------
  scroll.addEventListener("scroll", updateHBar);

  // ---------- таскаем ползунок ----------
  if (thumb && track) {
    let dragging = false, dragStartX = 0, startScrollLeft = 0;
    const onDown = (clientX) => {
      dragging = true;
      dragStartX = clientX;
      startScrollLeft = scroll.scrollLeft;
      thumb.style.cursor = "grabbing";
    };
    const onMove = (clientX) => {
      if (!dragging) return;
      const cw = scroll.clientWidth;
      const contentW = wrap.scrollWidth;
      const maxContentX = Math.max(0, contentW - cw);
      const maxThumbX = track.clientWidth - thumb.clientWidth;
      const dx = clientX - dragStartX;
      const dScroll = maxThumbX > 0 ? (dx / maxThumbX) * maxContentX : 0;
      scroll.scrollLeft = startScrollLeft + dScroll;
    };
    const onUp = () => { dragging = false; thumb.style.cursor = "grab"; };

    thumb.addEventListener("mousedown", (e) => { onDown(e.clientX); e.preventDefault(); });
    window.addEventListener("mousemove", (e) => onMove(e.clientX));
    window.addEventListener("mouseup", onUp);

    thumb.addEventListener("touchstart", (e) => { onDown(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
    thumb.addEventListener("touchmove",  (e) => { onMove(e.touches[0].clientX);  e.preventDefault(); }, { passive: false });
    thumb.addEventListener("touchend",   onUp);
    thumb.addEventListener("touchcancel",onUp);

    track.addEventListener("click", (e) => {
      if (e.target === thumb) return;
      const rect = track.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const cw = scroll.clientWidth;
      const contentW = wrap.scrollWidth;
      scroll.scrollLeft = (contentW - cw) * ratio;
    });
  }

  window.addEventListener("resize", updateHBar);
  requestAnimationFrame(updateHBar);
}

/* ============ заочники — рендер ============ */
function showZach() {
  const box = document.getElementById("zachTableBox");

  if (!zachSheets.length) {
    box.innerHTML = `<div class="msg">Файл ${ZACH_FILE} не найден или пуст</div>`;
    show("view-zach");
    return;
  }

  let html = '<div class="zach-scroll"><div class="zach-wrap">';

  zachSheets.forEach(sheet => {
    const rows = sheet.rows || [];
    if (!rows.length) return;

    const colCount = rows.reduce((m, r) => Math.max(m, (r || []).length), 0);

    html += '<div style="margin-bottom:16px"><table>';
    rows.forEach(row => {
      const r = row || [];
      const vals = r.map(cellToString);
      const nonEmpty = vals.filter(Boolean);

      if (!nonEmpty.length) {
        html += `<tr class="empty-row"><td colspan="${colCount}"></td></tr>`;
        return;
      }
      if (isGroupTitleRow(r)) {
        html += `<tr class="group-title"><td colspan="${colCount}">${esc(nonEmpty[0])}</td></tr>`;
        return;
      }
      if (isHeaderRow(r)) {
        let tds = "";
        for (let c = 0; c < colCount; c++) tds += `<td>${esc(vals[c] || "")}</td>`;
        html += `<tr class="header-row">${tds}</tr>`;
        return;
      }
      if (isDayRow(r)) {
        let tds = "";
        for (let c = 0; c < colCount; c++) tds += `<td>${esc(vals[c] || "")}</td>`;
        html += `<tr class="day-row">${tds}</tr>`;
        return;
      }
      if (isDateRow(r)) {
        let tds = "";
        for (let c = 0; c < colCount; c++) tds += `<td>${esc(vals[c] || "")}</td>`;
        html += `<tr class="date-row">${tds}</tr>`;
        return;
      }
      let tds = "";
      for (let c = 0; c < colCount; c++) {
        const v = vals[c] || "";
        tds += `<td>${v ? esc(v) : ""}</td>`;
      }
      html += `<tr>${tds}</tr>`;
    });
    html += "</table></div>";
  });

  html += '</div>';
  html += '<div class="zach-hbar"><div class="track"><div class="thumb"></div></div></div>';
  html += '</div>';

  box.innerHTML = html;

  setupZachPinch();
  show("view-zach");
}

function showDays() { show("view-days"); }

  .then(() => renderDays())
  .catch(e => {
    document.getElementById("fileInfo").textContent = "Ошибка: " + e.message;
    renderDays();
  });
