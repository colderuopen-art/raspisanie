<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Расписание занятий</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #0a84ff;
    --border: #e6e6ea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }

  header { text-align: center; margin: 12px 0 24px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  header p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .view { display: none; animation: fade .18s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  /* кнопки дней */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-btn {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 16px; padding: 18px 14px; text-align: left;
    cursor: pointer; font-size: 16px; font-weight: 600; color: var(--text);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .day-btn:active { transform: scale(.97); }
  @media (hover: hover) { .day-btn:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); border-color: var(--accent); } }
  .day-btn small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .day-btn.off { opacity: .45; }
  .day-btn.wide { grid-column: 1 / -1; text-align: center; }

  /* шапка экрана с кнопкой назад */
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .back {
    border: 1px solid var(--border); background: var(--card); border-radius: 12px;
    width: 40px; height: 40px; font-size: 18px; cursor: pointer; color: var(--accent);
    flex: 0 0 40px;
  }
  @media (hover: hover) { .back:hover { border-color: var(--accent); } }
  .topbar .title { flex: 1; }
  .topbar .title h2 { font-size: 18px; font-weight: 700; }
  .topbar .title span { font-size: 13px; color: var(--muted); }

  /* поиск */
  .search {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; margin-bottom: 12px;
    background: var(--card); outline: none;
  }
  .search:focus { border-color: var(--accent); }

  /* список групп */
  .groups { display: flex; flex-direction: column; gap: 8px; }
  .group-btn {
    border: 1px solid var(--border); background: var(--card); border-radius: 14px;
    padding: 14px 16px; font-size: 16px; font-weight: 600; text-align: left;
    cursor: pointer; color: var(--text);
    display: flex; justify-content: space-between; align-items: center;
  }
  .group-btn:active { transform: scale(.98); }
  @media (hover: hover) { .group-btn:hover { border-color: var(--accent); } }
  .group-btn::after { content: "›"; color: var(--muted); font-size: 20px; }

  /* карточка расписания */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; overflow: hidden;
  }
  .card .card-head { padding: 18px; border-bottom: 1px solid var(--border); }
  .card .card-head h2 { font-size: 20px; font-weight: 700; }
  .date-badge {
    display: inline-block; margin-top: 8px; font-size: 13px;
    background: #eef4ff; color: var(--accent); border-radius: 8px; padding: 4px 10px;
  }
  .lesson {
    display: flex; gap: 14px; padding: 14px 18px; align-items: baseline;
    border-bottom: 1px solid var(--border);
  }
  .lesson:last-child { border-bottom: none; }
  .lesson .num {
    flex: 0 0 64px; font-size: 13px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .3px;
  }
  .lesson .subj { font-size: 16px; }
  .lesson.empty .subj { color: var(--muted); }

  .msg { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ====== планшеты и ПК ====== */
  @media (min-width: 720px) {
    .wrap { max-width: 900px; padding: 32px 24px 48px; }
    header h1 { font-size: 28px; }
    header p { font-size: 14px; }
    .days { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .day-btn.wide { grid-column: auto; text-align: left; }
    .day-btn { padding: 22px 18px; }
    .groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
    .topbar .title h2 { font-size: 22px; }
    .card { max-width: 620px; }
  }
  @media (min-width: 1100px) {
    .wrap { max-width: 1060px; }
    .days { grid-template-columns: repeat(7, 1fr); gap: 12px; }
    .day-btn { padding: 18px 12px; font-size: 15px; text-align: center; }
    .day-btn.wide { text-align: center; }
    .groups { grid-template-columns: repeat(4, 1fr); }
    .card { margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Расписание занятий</h1>
    <p id="fileInfo">загрузка…</p>
  </header>

  <!-- экран 1: дни -->
  <section id="view-days" class="view active">
    <div class="days" id="days"></div>
  </section>

  <!-- экран 2: группы -->
  <section id="view-groups" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2 id="groupsDay"></h2><span id="groupsDate"></span></div>
    </div>
    <input class="search" id="search" placeholder="Поиск группы…" oninput="renderGroups()">
    <div class="groups" id="groups"></div>
  </section>

  <!-- экран 3: расписание группы -->
  <section id="view-schedule" class="view">
    <div class="topbar">
      <button class="back" onclick="showGroups()">‹</button>
      <div class="title"><h2 id="schedDay"></h2><span>выбери другую группу ← назад</span></div>
    </div>
    <div id="scheduleCard"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

<script>
/* ============ настройки ============ */
const XLSX_FILE = "Расписание.xlsx";  // файл должен лежать рядом с index.html

const DAYS = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА","ВОСКРЕСЕНЬЕ"];
const DAYS_RU = {
  "ПОНЕДЕЛЬНИК": "Понедельник", "ВТОРНИК": "Вторник", "СРЕДА": "Среда",
  "ЧЕТВЕРГ": "Четверг", "ПЯТНИЦА": "Пятница", "СУББОТА": "Суббота",
  "ВОСКРЕСЕНЬЕ": "Воскресенье"
};

let schedule = {};                 // данные из файла
let state = { day: null };         // выбранный день

/* ============ чтение xlsx в браузере ============ */
function fmtDate(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}

async function loadFile() {
  // no-store + метка времени: после замены файла на GitHub данные будут свежие
  const resp = await fetch(encodeURI(XLSX_FILE) + "?v=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("не найден файл " + XLSX_FILE);
  const lastMod = resp.headers.get("Last-Modified");

  const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

  for (const sheetName of wb.SheetNames) {
    const day = sheetName.trim().toUpperCase();
    if (day === "ИТОГ" || !DAYS.includes(day)) continue;

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });

    // строка 1 — ищем дату
    let date = "";
    for (const v of (rows[0] || [])) { if (v instanceof Date && !isNaN(v)) { date = fmtDate(v); break; } }

    // строка 2 — заголовки пар (количество любое, читаем до первой пустой)
    const hdr = rows[1] || [];
    const pairs = [];
    for (let c = 1; c < hdr.length; c++) {
      const h = String(hdr[c]).trim();
      if (!h) break;
      pairs.push(h);
    }

    // строка 3 и ниже — группы и предметы
    const data = [];
    for (let r = 2; r < rows.length; r++) {
      const g = String(rows[r][0] ?? "").trim();
      if (!g) continue;
      const row = [g];
      for (let c = 1; c <= pairs.length; c++) row.push(String(rows[r][c] ?? "").trim());
      data.push(row);
    }

    schedule[day] = { date, pairs, rows: data };
  }

  const upd = lastMod ? new Date(lastMod) : null;
  document.getElementById("fileInfo").textContent =
    "Файл: " + XLSX_FILE + (upd ? " · обновлён " + fmtDate(upd) : "");
}

/* ============ навигация ============ */
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* экран 1: дни */
function renderDays() {
  const box = document.getElementById("days");
  box.innerHTML = "";
  DAYS.forEach(day => {
    const d = schedule[day];
    const available = !!(d && d.pairs.length && d.rows.length);
    const b = document.createElement("button");
    b.className = "day-btn" + (available ? "" : " off") + (day === "ВОСКРЕСЕНЬЕ" ? " wide" : "");
    b.innerHTML = DAYS_RU[day] +
      `<small>${available ? (d.date || "") : (day === "ВОСКРЕСЕНЬЕ" ? "выходной" : "занятий нет")}</small>`;
    b.onclick = () => available ? showGroupsFor(day)
      : alert(day === "ВОСКРЕСЕНЬЕ" ? "Воскресенье — выходной :)" : "В этот день занятий нет");
    box.appendChild(b);
  });
}

/* экран 2: группы */
function showGroupsFor(day) {
  state.day = day;
  const d = schedule[day];
  document.getElementById("groupsDay").textContent = DAYS_RU[day];
  document.getElementById("groupsDate").textContent =
    d.date ? "Расписание от " + d.date : "Дата в файле не указана";
  document.getElementById("search").value = "";
  renderGroups();
  show("view-groups");
}

function renderGroups() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const box = document.getElementById("groups");
  box.innerHTML = "";
  const list = schedule[state.day].rows.map(r => r[0]).filter(g => g.toLowerCase().includes(q));
  if (!list.length) { box.innerHTML = `<div class="msg">Ничего не найдено</div>`; return; }
  list.forEach(g => {
    const b = document.createElement("button");
    b.className = "group-btn";
    b.textContent = g;
    b.onclick = () => showSchedule(g);
    box.appendChild(b);
  });
}

/* экран 3: расписание группы */
function showSchedule(group) {
  const d = schedule[state.day];
  const row = d.rows.find(r => r[0].toLowerCase() === group.toLowerCase());
  if (!row) { alert("Группа не найдена"); return; }

  document.getElementById("schedDay").textContent = DAYS_RU[state.day];
  const lessons = d.pairs.map((p, i) => ({ pair: p, subject: row[i + 1] || "—" }));

  document.getElementById("scheduleCard").innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>Группа ${row[0]}</h2>
        <span class="date-badge">${d.date ? "Дата: " + d.date : "Дата не указана"}</span>
      </div>
      ${lessons.map(l => `
        <div class="lesson ${l.subject === "—" ? "empty" : ""}">
          <div class="num">${l.pair}</div>
          <div class="subj">${l.subject}</div>
        </div>`).join("")}
    </div>`;
  show("view-schedule");
}

function showDays()   { show("view-days"); }
function showGroups() { show("view-groups"); }

/* ============ старт ============ */
loadFile()
  .then(renderDays)
  .catch(e => {
    document.getElementById("fileInfo").textContent = "Ошибка: " + e.message;
  });
</script>
</body>
</html>
