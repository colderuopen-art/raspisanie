<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Расписание занятий — ЕЭТ</title>
<script src="xlsx.full.min.js"></script>
<!-- мост MAX: внутри мессенджера даёт WebApp.ready() и системную кнопку «Назад» -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --text: #17324f;
    --muted: #8a948f;
    --accent: #2e7de0;
    --navy: #17324f;
    --orange: #e8542a;
    --border: #e4eae6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  .wrap.wide { max-width: 100%; }

  /* шапка с логотипом */
  header.brand {
    background: var(--card); text-align: center;
    padding: 0 0 20px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  header.brand .stripe {
    height: 5px;
    background: linear-gradient(90deg, #2e7de0 0%, #2e9e4f 55%, #e8542a 100%);
  }
  header.brand img.logo {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--border); margin-top: 18px;
  }
  header.brand h1 { font-size: 21px; font-weight: 700; margin-top: 10px; }
  header.brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  header.brand #fileInfo { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .view { display: none; animation: fade .18s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  /* кнопки дней */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-btn {
    border: 1px solid var(--border); border-top: 3px solid var(--accent);
    background: var(--card); border-radius: 14px; padding: 16px 14px;
    text-align: left; cursor: pointer; font-size: 16px; font-weight: 600;
    color: var(--text); transition: transform .1s ease, box-shadow .1s ease;
  }
  .day-btn:active { transform: scale(.97); }
  @media (hover: hover) { .day-btn:hover { box-shadow: 0 2px 10px rgba(23,50,79,.10); } }
  .day-btn small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .day-btn.wide { grid-column: 1 / -1; text-align: center; }
  /* кнопка звонков — как остальные, только фон с лёгкой голубизной */
  .day-btn.bells { background: #ddeafa; }
  /* НОВОЕ: кнопка заочников — светло-оранжевая */
  .day-btn.zach { background: #fdece3; border-top-color: var(--orange); }

  /* шапка экрана таблицы */
  .topbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 14px; }
  .back {
    border: none; background: var(--accent); border-radius: 12px;
    width: 42px; height: 42px; font-size: 20px; font-weight: 700;
    cursor: pointer; color: #fff; flex: 0 0 42px;
    box-shadow: 0 2px 8px rgba(46,125,224,.35);
  }
  @media (hover: hover) { .back:hover { background: #1f6fd0; } }
  .topbar .title h2 { font-size: 18px; font-weight: 700; }
  .topbar .title span { font-size: 13px; color: var(--muted); }

  /* таблица расписания */
  .tbl-wrap {
    overflow: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    max-height: calc(100vh - 190px);
  }
  table { border-collapse: separate; border-spacing: 0; min-width: 640px; width: 100%; font-size: 14px; }
  th, td {
    padding: 10px 12px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  th:last-child, td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  td.grp, th.grp {
    position: sticky; left: 0; z-index: 1;
    background: var(--card); font-weight: 600; white-space: nowrap;
  }
  thead th.grp { z-index: 3; background: var(--navy); }
  td.muted { color: var(--muted); }
  @media (hover: hover) { tbody tr:hover td, tbody tr:hover td.grp { background: #f2f7fd; } }

  /* экран «Расписание звонков» */
  .bells-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; text-align: center;
  }
  .bells-card img { max-width: 100%; height: auto; border-radius: 8px; }

  .msg { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ====== НОВОЕ: экран «Заочное обучение» ====== */
  .zach-tabs {
    display: flex; overflow-x: auto; gap: 8px;
    padding: 4px 2px 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  .zach-tabs::-webkit-scrollbar { height: 6px; }
  .zach-tabs::-webkit-scrollbar-thumb { background: #d3dbd7; border-radius: 3px; }
  .zach-tab {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--text); white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  .zach-tab:hover { background: #f2f7fd; }
  .zach-tab.active {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  /* таблица заочников: у нас "файл как есть", поэтому строки с днями — заголовочные */
  .zach-table td, .zach-table th { font-size: 13px; padding: 8px 10px; }
  .zach-day-row td {
    background: #eef4fb; font-weight: 700; color: var(--navy);
  }
  .zach-date-row td {
    background: #f7fafc; color: var(--muted); font-size: 12px;
  }
  .zach-group-title {
    font-size: 14px; font-weight: 700; color: var(--navy);
    padding: 12px 4px 6px; margin-bottom: 4px;
  }

  /* ====== планшеты и ПК ====== */
  @media (min-width: 720px) {
    .wrap { max-width: 900px; padding: 0 24px 48px; }
    .wrap.wide { max-width: 1200px; }
    header.brand h1 { font-size: 26px; }
    header.brand img.logo { width: 92px; height: 92px; }
    .days { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .day-btn { padding: 20px 18px; }
    .topbar .title h2 { font-size: 22px; }
    table { font-size: 15px; }
  }
  @media (min-width: 1100px) {
    .wrap { max-width: 1060px; }
    .wrap.wide { max-width: 1400px; }
    .days { grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .day-btn { padding: 16px 12px; font-size: 15px; text-align: center; }
  }
</style>
</head>
<body>

<header class="brand">
  <div class="stripe"></div>
  <img class="logo" src="logo.png" alt="ЕЭТ">
  <h1>Расписание занятий</h1>
  <p class="sub">Екатеринбургский энергетический техникум</p>
  <p id="fileInfo">загрузка…</p>
</header>

<div class="wrap" id="wrap">

  <!-- экран 1: дни -->
  <section id="view-days" class="view active">
    <div class="days" id="days"></div>
  </section>

  <!-- экран 2: таблица дня -->
  <section id="view-table" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2 id="tblDay"></h2><span id="tblDate"></span></div>
    </div>
    <div id="tableBox"></div>
  </section>

  <!-- экран 3: расписание звонков (картинка) -->
  <section id="view-bells" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание звонков</h2><span>время начала и конца пар</span></div>
    </div>
    <div class="bells-card">
      <img id="bellsImg" alt="Расписание звонков"
           onerror="this.style.display='none';document.getElementById('bellsErr').style.display='block';">
      <div class="msg" id="bellsErr" style="display:none">Файл Звонки.jpg не найден рядом с сайтом</div>
    </div>
  </section>

  <!-- НОВОЕ: экран 4: расписание заочного обучения -->
  <section id="view-zach" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание заочное обучение</h2><span id="zachSubtitle"></span></div>
    </div>
    <div id="zachTabs" class="zach-tabs"></div>
    <div id="zachTableBox"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

<script>
/* ============ настройки ============ */
const XLSX_FILE  = "Расписание.xlsx";  // очники
const BELLS_FILE = "Звонки.jpg";       // картинка со звонками
const ZACH_FILE  = "зо.xlsx";          // НОВОЕ: файл для заочников

// на экране только рабочие дни; воскресенья нет
const DAYS = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА"];
const DAYS_RU = {
  "ПОНЕДЕЛЬНИК": "Понедельник", "ВТОРНИК": "Вторник", "СРЕДА": "Среда",
  "ЧЕТВЕРГ": "Четверг", "ПЯТНИЦА": "Пятница", "СУББОТА": "Суббота"
};

let schedule = {};        // очники
let zachGroups = [];      // НОВОЕ: [{title, rows}, ...] — блоки заочников

/* ============ вспомогательное ============ */
function fmtDate(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

/* ============ чтение xlsx очников ============ */
async function loadFile() {
  const resp = await fetch(encodeURI(XLSX_FILE) + "?v=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("не найден файл " + XLSX_FILE);
  const lastMod = resp.headers.get("Last-Modified");

  const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

  for (const sheetName of wb.SheetNames) {
    const day = sheetName.trim().toUpperCase();
    if (day === "ИТОГ" || !DAYS.includes(day)) continue;

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });

    let date = "";
    for (const v of (rows[0] || [])) {
      if (v instanceof Date && !isNaN(v)) { date = fmtDate(v); break; }
    }

    const hdr = rows[1] || [];
    const pairs = [];
    for (let c = 1; c < hdr.length; c++) {
      const h = String(hdr[c]).trim();
      if (!h) break;
      pairs.push(h);
    }

    const data = [];
    for (let r = 2; r < rows.length; r++) {
      const g = String(rows[r][0] ?? "").trim();
      if (!g) continue;
      const row = [g];
      for (let c = 1; c <= pairs.length; c++) row.push(String(rows[r][c] ?? "").trim());
      data.push(row);
    }

    schedule[day] = { date, pairs, rows: data };
  }

  const upd = lastMod ? new Date(lastMod) : null;
  document.getElementById("fileInfo").textContent =
    upd ? "Обновление " + fmtDate(upd) : "";
}

/* ============ НОВОЕ: чтение xlsx заочников ============
   Файл содержит ОДИН лист, внутри которого — несколько блоков,
   разделённых заголовками вида:
     "Расписание занятий заочного отделения групп Эу-358,359,360"
   Режем лист на блоки по этим заголовкам и делаем из них вкладки.
*/
async function loadZachFile() {
  try {
    const resp = await fetch(encodeURI(ZACH_FILE) + "?v=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("не найден файл " + ZACH_FILE);
    const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

    zachGroups = [];

    for (const sheetName of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });

      // Индекс колонки, в которой лежат заголовки блоков (обычно A=0 или B=1).
      // Ищем по первой строке, содержащей подстроку "заочн".
      let titleCol = 1;
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < (rows[r] || []).length; c++) {
          const v = String(rows[r][c] || "");
          if (/заочн/i.test(v) && /групп/i.test(v)) { titleCol = c; r = rows.length; break; }
        }
      }

      // Находим все строки-заголовки блоков
      const titleIdx = [];
      for (let r = 0; r < rows.length; r++) {
        const v = String((rows[r] || [])[titleCol] || "").trim();
        if (/^Расписание занятий заочного отделения/i.test(v)) {
          titleIdx.push({ row: r, title: v });
        }
      }

      // Режем на блоки
      for (let i = 0; i < titleIdx.length; i++) {
        const start = titleIdx[i].row;
        const end   = (i + 1 < titleIdx.length) ? titleIdx[i + 1].row : rows.length;

        // Строки блока, начиная со следующей после заголовка
        const blockRows = [];
        for (let r = start + 1; r < end; r++) {
          const row = rows[r] || [];
          // Обрезаем строку по последней значимой ячейке
          let last = -1;
          for (let c = 0; c < row.length; c++) {
            if (String(row[c] || "").trim() !== "") last = c;
          }
          if (last >= 0) blockRows.push(row.slice(0, last + 1));
          else blockRows.push([]); // пустая строка — сохраняем как разделитель
        }

        // Отрезаем "хвостовые" пустые строки блока
        while (blockRows.length && blockRows[blockRows.length - 1].every(v => String(v || "").trim() === "")) {
          blockRows.pop();
        }

        // Заголовок для вкладки: сокращаем до названий групп
        let tabTitle = titleIdx[i].title
          .replace(/^Расписание занятий заочного отделения\s*/i, "")
          .replace(/^групп\s*/i, "")
          .trim();
        if (!tabTitle) tabTitle = "Группа " + (i + 1);

        zachGroups.push({
          title: titleIdx[i].title,     // полный заголовок для подписи
          tab:   tabTitle,              // короткое имя для вкладки
          rows:  blockRows,
        });
      }
    }
  } catch (e) {
    console.error("Ошибка загрузки файла заочников:", e);
    zachGroups = [{ title: "Ошибка загрузки", tab: "Ошибка",
                    rows: [[`Не удалось загрузить файл ${ZACH_FILE}`]] }];
  }
}

/* ============ навигация ============ */
const inMax = typeof window.WebApp !== "undefined" && window.WebApp;
if (inMax) {
  WebApp.ready();
  WebApp.BackButton.onClick(() => {
    const active = document.querySelector(".view.active").id;
    if (active === "view-table" || active === "view-bells" || active === "view-zach") showDays();
    else WebApp.close();
  });
}
function syncBackButton() {
  if (!inMax) return;
  const active = document.querySelector(".view.active").id;
  if (active === "view-days") WebApp.BackButton.hide();
  else WebApp.BackButton.show();
}

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  const wideViews = ["view-table", "view-zach"];
  document.getElementById("wrap").classList.toggle("wide", wideViews.includes(id));
  window.scrollTo(0, 0);
  syncBackButton();
}

/* ============ экран 1: дни ============ */
function renderDays() {
  const box = document.getElementById("days");
  box.innerHTML = "";
  DAYS.forEach(day => {
    const d = schedule[day];
    const b = document.createElement("button");
    b.className = "day-btn";
    b.innerHTML = DAYS_RU[day] +
      `<small>${d ? (d.date || "дата не указана") : "нет данных"}</small>`;
    b.onclick = () => showTable(day);
    box.appendChild(b);
  });

  // кнопка «Расписание звонков»
  const bells = document.createElement("button");
  bells.className = "day-btn bells wide";
  bells.innerHTML = "Расписание звонков<small>время начала и конца пар</small>";
  bells.onclick = showBells;
  box.appendChild(bells);

  // НОВОЕ: кнопка «Расписание заочное обучение»
  const zach = document.createElement("button");
  zach.className = "day-btn zach wide";
  zach.innerHTML = "Расписание заочное обучение<small>сессии по группам заочного отделения</small>";
  zach.onclick = showZach;
  box.appendChild(zach);
}

/* ============ экран 2: таблица дня (очники) ============ */
function showTable(day) {
  const d = schedule[day];
  document.getElementById("tblDay").textContent = DAYS_RU[day];
  document.getElementById("tblDate").textContent =
    d && d.date ? "Расписание от " + d.date : "Дата в файле не указана";

  if (!d || !d.rows.length) {
    document.getElementById("tableBox").innerHTML = `<div class="msg">Нет данных на этот день</div>`;
    show("view-table");
    return;
  }

  const pairs = d.pairs.length ? d.pairs : ["Занятия"];

  let html = '<div class="tbl-wrap"><table><thead><tr><th class="grp">Группа</th>';
  pairs.forEach(p => { html += `<th>${esc(p)}</th>`; });
  html += "</tr></thead><tbody>";

  d.rows.forEach(r => {
    html += `<tr><td class="grp">${esc(r[0])}</td>`;
    for (let i = 0; i < pairs.length; i++) {
      const s = d.pairs.length ? (r[i + 1] || "") : "";
      const muted = /САМОСТОЯТЕЛЬН/i.test(s) || !s;
      html += `<td${muted ? ' class="muted"' : ""}>${s ? esc(s) : "—"}</td>`;
    }
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  document.getElementById("tableBox").innerHTML = html;
  show("view-table");
}

/* ============ экран 3: звонки ============ */
function showBells() {
  const img = document.getElementById("bellsImg");
  document.getElementById("bellsErr").style.display = "none";
  img.style.display = "";
  img.src = encodeURI(BELLS_FILE) + "?v=" + Date.now();
  show("view-bells");
}

/* ============ НОВОЕ: экран 4 — заочники ============
   Рендерит таблицу блока "как в Excel": без заголовков <thead>,
   первая строка блока — обычная строка таблицы. Строки, где во всех
   ячейках написано название дня недели, подсвечиваем. Строки с датой —
   тоже слегка подсвечиваем. Пустые строки оставляем как разделители.
*/
function renderZachTable(idx) {
  const group = zachGroups[idx];
  if (!group) return;

  // Переключаем активную вкладку
  document.querySelectorAll(".zach-tab").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });
  document.getElementById("zachSubtitle").textContent = group.title;

  const rows = group.rows || [];
  if (!rows.length) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">Нет данных на этот блок</div>`;
    return;
  }

  // Определяем максимальное число колонок
  const colCount = rows.reduce((m, r) => Math.max(m, r.length), 0);

  // Собираем HTML-таблицу
  let html = '<div class="tbl-wrap"><table class="zach-table"><tbody>';
  rows.forEach(r => {
    // Пустая строка-разделитель
    if (!r.length || r.every(v => String(v || "").trim() === "")) {
      html += `<tr class="zach-date-row"><td colspan="${colCount}">&nbsp;</td></tr>`;
      return;
    }

    // Проверяем тип строки
    const nonEmpty = r.map(v => String(v || "").trim()).filter(Boolean);
    const isDayRow = nonEmpty.length > 0 &&
      nonEmpty.every(v => ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"].includes(v));
    const isDateRow = nonEmpty.length > 0 &&
      nonEmpty.every(v => /^\d{4}-\d{2}-\d{2}/.test(v) || /^\d{2}\.\d{2}\.\d{4}$/.test(v));

    let cls = "";
    if (isDayRow) cls = ' class="zach-day-row"';
    else if (isDateRow) cls = ' class="zach-date-row"';

    html += `<tr${cls}>`;
    for (let c = 0; c < colCount; c++) {
      const raw = r[c];
      let val = raw == null ? "" : String(raw);
      // Даты форматируем красиво
      if (raw instanceof Date && !isNaN(raw)) val = fmtDate(raw);
      // ISO-строку с временем тоже форматируем
      const m = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) val = `${m[3]}.${m[2]}.${m[1]}`;
      html += `<td>${esc(val)}</td>`;
    }
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  document.getElementById("zachTableBox").innerHTML = html;
}

function showZach() {
  const tabsBox = document.getElementById("zachTabs");
  tabsBox.innerHTML = "";

  if (!zachGroups.length) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">Файл ${ZACH_FILE} не найден или пуст</div>`;
    document.getElementById("zachSubtitle").textContent = "";
    show("view-zach");
    return;
  }

  // Вкладки по группам
  zachGroups.forEach((g, i) => {
    const tab = document.createElement("button");
    tab.className = "zach-tab";
    tab.textContent = g.tab;
    tab.onclick = () => renderZachTable(i);
    tabsBox.appendChild(tab);
  });

  renderZachTable(0);
  show("view-zach");
}

/* ============ прочее ============ */
function showDays() { show("view-days"); }

/* ============ старт ============ */
Promise.all([loadFile(), loadZachFile()])
  .then(() => renderDays())
  .catch(e => {
    document.getElementById("fileInfo").textContent = "Ошибка: " + e.message;
    renderDays();
  });
</script>
