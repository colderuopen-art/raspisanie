<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Расписание занятий — ЕЭТ</title>
<script src="xlsx.full.min.js"></script>
<!-- мост MAX: внутри мессенджера даёт WebApp.ready() и системную кнопку «Назад» -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --text: #17324f;
    --muted: #8a948f;
    --accent: #2e7de0;
    --navy: #17324f;
    --orange: #e8542a;
    --border: #e4eae6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  .wrap.wide { max-width: 100%; }

  /* шапка с логотипом */
  header.brand {
    background: var(--card); text-align: center;
    padding: 0 0 20px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  header.brand .stripe {
    height: 5px;
    background: linear-gradient(90deg, #2e7de0 0%, #2e9e4f 55%, #e8542a 100%);
  }
  header.brand img.logo {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--border); margin-top: 18px;
  }
  header.brand h1 { font-size: 21px; font-weight: 700; margin-top: 10px; }
  header.brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  header.brand #fileInfo { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .view { display: none; animation: fade .18s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  /* кнопки дней */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .day-btn {
    border: 1px solid var(--border); border-top: 3px solid var(--accent);
    background: var(--card); border-radius: 14px; padding: 16px 14px;
    text-align: left; cursor: pointer; font-size: 16px; font-weight: 600;
    color: var(--text); transition: transform .1s ease, box-shadow .1s ease;
  }
  .day-btn:active { transform: scale(.97); }
  @media (hover: hover) { .day-btn:hover { box-shadow: 0 2px 10px rgba(23,50,79,.10); } }
  .day-btn small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .day-btn.wide { grid-column: 1 / -1; text-align: center; }
  .day-btn.bells { background: #ddeafa; }
  /* кнопка заочников — светло-оранжевая */
  .day-btn.zach  { background: #fdece3; border-top-color: var(--orange); }

  /* шапка экрана таблицы */
  .topbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 14px; }
  .back {
    border: none; background: var(--accent); border-radius: 12px;
    width: 42px; height: 42px; font-size: 20px; font-weight: 700;
    cursor: pointer; color: #fff; flex: 0 0 42px;
    box-shadow: 0 2px 8px rgba(46,125,224,.35);
  }
  @media (hover: hover) { .back:hover { background: #1f6fd0; } }
  .topbar .title h2 { font-size: 18px; font-weight: 700; }
  .topbar .title span { font-size: 13px; color: var(--muted); }

  /* таблица расписания */
  .tbl-wrap {
    overflow: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    max-height: calc(100vh - 190px);
  }
  table { border-collapse: separate; border-spacing: 0; min-width: 640px; width: 100%; font-size: 14px; }
  th, td {
    padding: 10px 12px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  th:last-child, td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  td.grp, th.grp {
    position: sticky; left: 0; z-index: 1;
    background: var(--card); font-weight: 600; white-space: nowrap;
  }
  thead th.grp { z-index: 3; background: var(--navy); }
  td.muted { color: var(--muted); }
  @media (hover: hover) { tbody tr:hover td, tbody tr:hover td.grp { background: #f2f7fd; } }

  /* экран «Расписание звонков» */
  .bells-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; text-align: center;
  }
  .bells-card img { max-width: 100%; height: auto; border-radius: 8px; }

  .msg { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ====== экран «Заочное обучение» ====== */
  .zach-tabs {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px;
    padding: 4px 2px 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  .zach-tabs::-webkit-scrollbar { height: 6px; }
  .zach-tabs::-webkit-scrollbar-thumb { background: #d3dbd7; border-radius: 3px; }
  .zach-tab {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--text); white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  @media (hover: hover) { .zach-tab:hover { background: #f2f7fd; } }
  .zach-tab.active {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  /* таблица заочников: три недели по три подколонки */
  .zach-table { min-width: 900px; font-size: 13px; }
  .zach-table th, .zach-table td { padding: 8px 10px; }
  .zach-table thead th { text-align: center; }
  .zach-table thead tr.dates th { background: #26415f; font-size: 12px; }
  .zach-table thead tr.cols  th { background: var(--navy); font-size: 11px; color: #cdd9e8; }
  .zach-table td.day-row {
    background: #eef4fb; color: var(--navy); font-weight: 700;
    text-align: center; white-space: nowrap;
  }
  .zach-table td.date-row {
    background: #f7fafc; color: var(--muted); font-size: 12px; text-align: center;
  }
  .zach-table td.num {
    background: var(--card); font-weight: 600; text-align: center;
    color: var(--navy); position: sticky; left: 0; z-index: 1;
    width: 42px;
  }
  .zach-table thead th.num {
    background: #26415f; color: #fff; position: sticky; left: 0; z-index: 3;
  }
  .zach-table td.kab { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ====== планшеты и ПК ====== */
  @media (min-width: 720px) {
    .wrap { max-width: 900px; padding: 0 24px 48px; }
    .wrap.wide { max-width: 1200px; }
    header.brand h1 { font-size: 26px; }
    header.brand img.logo { width: 92px; height: 92px; }
    .days { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .day-btn { padding: 20px 18px; }
    .topbar .title h2 { font-size: 22px; }
    table { font-size: 15px; }
  }
  @media (min-width: 1100px) {
    .wrap { max-width: 1060px; }
    .wrap.wide { max-width: 1400px; }
    .days { grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .day-btn { padding: 16px 12px; font-size: 15px; text-align: center; }
  }
</style>
</head>
<body>

<header class="brand">
  <div class="stripe"></div>
  <img class="logo" src="logo.png" alt="ЕЭТ">
  <h1>Расписание занятий</h1>
  <p class="sub">Екатеринбургский энергетический техникум</p>
  <p id="fileInfo">загрузка…</p>
</header>

<div class="wrap" id="wrap">

  <!-- экран 1: дни -->
  <section id="view-days" class="view active">
    <div class="days" id="days"></div>
  </section>

  <!-- экран 2: таблица дня -->
  <section id="view-table" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2 id="tblDay"></h2><span id="tblDate"></span></div>
    </div>
    <div id="tableBox"></div>
  </section>

  <!-- экран 3: расписание звонков (картинка) -->
  <section id="view-bells" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание звонков</h2><span>время начала и конца пар</span></div>
    </div>
    <div class="bells-card">
      <img id="bellsImg" alt="Расписание звонков"
           onerror="this.style.display='none';document.getElementById('bellsErr').style.display='block';">
      <div class="msg" id="bellsErr" style="display:none">Файл Звонки.jpg не найден рядом с сайтом</div>
    </div>
  </section>

  <!-- экран 4: расписание заочного обучения -->
  <section id="view-zach" class="view">
    <div class="topbar">
      <button class="back" onclick="showDays()">‹</button>
      <div class="title"><h2>Расписание заочное обучение</h2><span id="zachSubtitle"></span></div>
    </div>
    <div id="zachTabs" class="zach-tabs"></div>
    <div id="zachTableBox"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

<script>
/* ============ настройки ============ */
const XLSX_FILE  = "Расписание.xlsx";  // очники
const BELLS_FILE = "Звонки.jpg";       // картинка со звонками
const ZACH_FILE  = "зо.xlsx";          // заочники

const DAYS = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА"];
const DAYS_RU = {
  "ПОНЕДЕЛЬНИК": "Понедельник", "ВТОРНИК": "Вторник", "СРЕДА": "Среда",
  "ЧЕТВЕРГ": "Четверг", "ПЯТНИЦА": "Пятница", "СУББОТА": "Суббота"
};
// Порядок дней недели для сортировки расписания заочников
const WEEK_ORDER = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА","ВОСКРЕСЕНЬЕ"];

let schedule = {};        // очники
let zachGroups = [];      // заочники: [{tab, title, weeks:[{dateStr, days:{ПОНЕДЕЛЬНИК:{subj,prep,kab},...}}]}]

/* ============ вспомогательное ============ */
function fmtDate(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
// Преобразование значения ячейки в строку: дату — в дд.мм.гггг
function cellToString(v) {
  if (v == null) return "";
  if (v instanceof Date && !isNaN(v)) return fmtDate(v);
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}.${m[2]}.${m[1]}`;
  return s;
}
// Является ли строка "строкой дня недели" (Понедельник / Вторник / ...)
function isDayHeaderRow(row) {
  const vals = row.map(v => cellToString(v)).filter(Boolean);
  if (!vals.length) return false;
  const hits = vals.filter(v => WEEK_ORDER.includes(v.toUpperCase()));
  return hits.length >= 1 && hits.length === vals.length;
}
// Является ли строка "строкой с датой" (например, 12.10.2026)
function isDateRow(row) {
  const vals = row.map(v => cellToString(v)).filter(Boolean);
  if (!vals.length) return false;
  return vals.every(v => /^\d{2}\.\d{2}\.\d{4}$/.test(v));
}

/* ============ чтение xlsx очников ============ */
async function loadFile() {
  const resp = await fetch(encodeURI(XLSX_FILE) + "?v=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("не найден файл " + XLSX_FILE);
  const lastMod = resp.headers.get("Last-Modified");

  const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

  for (const sheetName of wb.SheetNames) {
    const day = sheetName.trim().toUpperCase();
    if (day === "ИТОГ" || !DAYS.includes(day)) continue;

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });

    let date = "";
    for (const v of (rows[0] || [])) {
      if (v instanceof Date && !isNaN(v)) { date = fmtDate(v); break; }
    }

    const hdr = rows[1] || [];
    const pairs = [];
    for (let c = 1; c < hdr.length; c++) {
      const h = String(hdr[c]).trim();
      if (!h) break;
      pairs.push(h);
    }

    const data = [];
    for (let r = 2; r < rows.length; r++) {
      const g = String(rows[r][0] ?? "").trim();
      if (!g) continue;
      const row = [g];
      for (let c = 1; c <= pairs.length; c++) row.push(String(rows[r][c] ?? "").trim());
      data.push(row);
    }

    schedule[day] = { date, pairs, rows: data };
  }

  const upd = lastMod ? new Date(lastMod) : null;
  document.getElementById("fileInfo").textContent =
    upd ? "Обновление " + fmtDate(upd) : "";
}

/* ============ чтение xlsx заочников ============
   Файл содержит один лист с несколькими блоками, разделёнными
   заголовками вида "Расписание занятий заочного отделения групп X".
   Внутри каждого блока для каждой недели есть:
     - строка "Понедельник" / "Вторник" / ...
     - строка с датой (12.10.2026)
     - 7 строк пар: № | Предмет | Преподаватель | Каб (×3 недели)
   Парсим всё это в структуру:
     zachGroups = [{tab, title, weeks:[{dateStr, days:{ДЕНЬ:{pairs:[{subj,prep,kab}]}}}]}]
*/
async function loadZachFile() {
  try {
    const resp = await fetch(encodeURI(ZACH_FILE) + "?v=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("не найден файл " + ZACH_FILE);
    const wb = XLSX.read(await resp.arrayBuffer(), { cellDates: true });

    zachGroups = [];

    for (const sheetName of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "" });

      // Ищем столбец, где лежат заголовки блоков — обычно B, но подстрахуемся.
      let titleCol = 1;
      outer:
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < (rows[r] || []).length; c++) {
          const v = String(rows[r][c] || "");
          if (/заочн/i.test(v) && /групп/i.test(v)) { titleCol = c; break outer; }
        }
      }

      // Находим все заголовки блоков
      const titleIdx = [];
      for (let r = 0; r < rows.length; r++) {
        const v = String((rows[r] || [])[titleCol] || "").trim();
        if (/^Расписание занятий заочного отделения/i.test(v)) {
          titleIdx.push({ row: r, title: v });
        }
      }

      for (let i = 0; i < titleIdx.length; i++) {
        const start = titleIdx[i].row;
        const end   = (i + 1 < titleIdx.length) ? titleIdx[i + 1].row : rows.length;
        const block = rows.slice(start + 1, end);

        // --- определяем, сколько недель идут параллельно ---
        // Возьмём самую "широкую" строку с днями недели — по ней поймём,
        // сколько раз в строке встречается "Понедельник" (или другой день).
        let maxCols = 0;
        for (const r of block) maxCols = Math.max(maxCols, (r || []).length);
        // Обычно 3 недели × 4 колонки (№, Предмет, Преподаватель, Каб) = 12
        const WEEK_STRIDE = 4;
        const weekCount = Math.max(1, Math.floor((maxCols - 1) / WEEK_STRIDE));
        // Офсеты начала каждой недели внутри строки:
        // сдвиг в файле: колонка № у первой недели = 1, потом 2-3-4 —
        // но во второй неделе та же структура сдвинута на 5, третья — на 9.
        // Проще: смотрим на реальные данные, у нас 1-я неделя на B..E (1..4),
        // 2-я — на F..I (5..8), 3-я — на J..M (9..12).
        // Мы используем индексы массива (0-based). Тогда:
        //   week w: colNum    = 1 + w*4
        //           colSubj   = 2 + w*4
        //           colPrep   = 3 + w*4
        //           colKab    = 4 + w*4

        // --- парсим блок по строкам ---
        const weeks = [];
        for (let w = 0; w < weekCount; w++) {
          weeks.push({ dateStr: "", days: {} });
        }
        let curDay = null;         // текущий день недели
        let curWeek = -1;          // текущая неделя (индекс) — устанавливается по date-строке

        for (const raw of block) {
          const row = raw || [];

          // Строка дня недели? Может встречаться несколько раз (в разных неделях).
          if (isDayHeaderRow(row)) {
            // Определим, какие дни в этой строке — по позициям
            // Первый день — Понедельник (или что в файле), дальше идут другие.
            // Обычно в одной строке все 3 недели содержат один и тот же день.
            let dayName = null;
            for (let c = 0; c < row.length; c++) {
              const v = cellToString(row[c]).toUpperCase();
              if (WEEK_ORDER.includes(v)) { dayName = v; break; }
            }
            if (dayName) {
              curDay = dayName;
              // убедимся, что во всех неделях создан контейнер этого дня
              for (const wk of weeks) {
                if (!wk.days[curDay]) wk.days[curDay] = { pairs: [] };
              }
            }
            continue;
          }

          // Строка с датами? (по одной дате на каждую неделю)
          if (isDateRow(row)) {
            // Даты по неделям: идут подряд в "тех же" позициях, что и №,
            // но обычно просто подряд. Соберём все даты, найденные в строке.
            const dates = [];
            for (let c = 0; c < row.length; c++) {
              const s = cellToString(row[c]);
              if (/^\d{2}\.\d{2}\.\d{4}$/.test(s)) dates.push(s);
            }
            // Раскидываем по неделям: dates[0] → weeks[0], dates[1] → weeks[1], ...
            for (let k = 0; k < Math.min(dates.length, weeks.length); k++) {
              if (!weeks[k].dateStr) weeks[k].dateStr = dates[k];
            }
            continue;
          }

          // Пустая строка-разделитель
          const nonEmpty = row.map(v => cellToString(v)).filter(Boolean);
          if (!nonEmpty.length) continue;

          // Строка пары? У неё в каждой "недельной" четвёрке есть № пары (1..7).
          // Обрабатываем как "строка со всеми тремя неделями одновременно".
          if (curDay) {
            for (let w = 0; w < weeks.length; w++) {
              const off = 1 + w * 4;
              const numRaw = row[off];
              const subj   = cellToString(row[off + 1]);
              const prep   = cellToString(row[off + 2]);
              const kab    = cellToString(row[off + 3]);
              const num    = parseInt(cellToString(numRaw), 10);
              if (!isNaN(num) && num >= 1 && num <= 8) {
                const wk = weeks[w];
                if (!wk.days[curDay]) wk.days[curDay] = { pairs: [] };
                wk.days[curDay].pairs[num - 1] = { subj, prep, kab };
              }
            }
          }
        }

        // Краткое имя для вкладки
        let tabTitle = titleIdx[i].title
          .replace(/^Расписание занятий заочного отделения\s*/i, "")
          .replace(/^групп\s*/i, "")
          .trim();
        if (!tabTitle) tabTitle = "Группа " + (i + 1);

        zachGroups.push({
          tab: tabTitle,
          title: titleIdx[i].title,
          weeks: weeks,
        });
      }
    }
  } catch (e) {
    console.error("Ошибка загрузки файла заочников:", e);
    zachGroups = [{
      tab: "Ошибка",
      title: "Ошибка загрузки",
      weeks: [{ dateStr: "", days: {} }],
      error: `Не удалось загрузить файл ${ZACH_FILE}`,
    }];
  }
}

/* ============ навигация ============ */
const inMax = typeof window.WebApp !== "undefined" && window.WebApp;
if (inMax) {
  WebApp.ready();
  WebApp.BackButton.onClick(() => {
    const active = document.querySelector(".view.active").id;
    if (active === "view-table" || active === "view-bells" || active === "view-zach") showDays();
    else WebApp.close();
  });
}
function syncBackButton() {
  if (!inMax) return;
  const active = document.querySelector(".view.active").id;
  if (active === "view-days") WebApp.BackButton.hide();
  else WebApp.BackButton.show();
}

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  const wideViews = ["view-table", "view-zach"];
  document.getElementById("wrap").classList.toggle("wide", wideViews.includes(id));
  window.scrollTo(0, 0);
  syncBackButton();
}

/* ============ экран 1: дни ============ */
function renderDays() {
  const box = document.getElementById("days");
  box.innerHTML = "";
  DAYS.forEach(day => {
    const d = schedule[day];
    const b = document.createElement("button");
    b.className = "day-btn";
    b.innerHTML = DAYS_RU[day] +
      `<small>${d ? (d.date || "дата не указана") : "нет данных"}</small>`;
    b.onclick = () => showTable(day);
    box.appendChild(b);
  });

  const bells = document.createElement("button");
  bells.className = "day-btn bells wide";
  bells.innerHTML = "Расписание звонков<small>время начала и конца пар</small>";
  bells.onclick = showBells;
  box.appendChild(bells);

  const zach = document.createElement("button");
  zach.className = "day-btn zach wide";
  zach.innerHTML = "Расписание заочное обучение<small>сессии по группам заочного отделения</small>";
  zach.onclick = showZach;
  box.appendChild(zach);
}

/* ============ экран 2: таблица дня (очники) ============ */
function showTable(day) {
  const d = schedule[day];
  document.getElementById("tblDay").textContent = DAYS_RU[day];
  document.getElementById("tblDate").textContent =
    d && d.date ? "Расписание от " + d.date : "Дата в файле не указана";

  if (!d || !d.rows.length) {
    document.getElementById("tableBox").innerHTML = `<div class="msg">Нет данных на этот день</div>`;
    show("view-table");
    return;
  }

  const pairs = d.pairs.length ? d.pairs : ["Занятия"];

  let html = '<div class="tbl-wrap"><table><thead><tr><th class="grp">Группа</th>';
  pairs.forEach(p => { html += `<th>${esc(p)}</th>`; });
  html += "</tr></thead><tbody>";

  d.rows.forEach(r => {
    html += `<tr><td class="grp">${esc(r[0])}</td>`;
    for (let i = 0; i < pairs.length; i++) {
      const s = d.pairs.length ? (r[i + 1] || "") : "";
      const muted = /САМОСТОЯТЕЛЬН/i.test(s) || !s;
      html += `<td${muted ? ' class="muted"' : ""}>${s ? esc(s) : "—"}</td>`;
    }
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  document.getElementById("tableBox").innerHTML = html;
  show("view-table");
}

/* ============ экран 3: звонки ============ */
function showBells() {
  const img = document.getElementById("bellsImg");
  document.getElementById("bellsErr").style.display = "none";
  img.style.display = "";
  img.src = encodeURI(BELLS_FILE) + "?v=" + Date.now();
  show("view-bells");
}

/* ============ экран 4: заочники ============
   Таблица для выбранной группы:
   - thead: две строки — «даты недель» и «№ | Предмет | Преподаватель | Каб»
   - tbody: идём по дням недели по порядку Пн..Вс, внутри дня — 7 строк пар
   - для дней, где нет данных ни в одной неделе — не выводим
*/
function renderZachTable(idx) {
  const group = zachGroups[idx];
  if (!group) return;

  // активная вкладка
  document.querySelectorAll(".zach-tab").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });
  document.getElementById("zachSubtitle").textContent = group.title;

  if (group.error) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">${esc(group.error)}</div>`;
    return;
  }

  const weeks = group.weeks || [];
  if (!weeks.length) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">Нет данных по этой группе</div>`;
    return;
  }

  // Определим, какие дни недели встречаются хотя бы в одной неделе группы
  const usedDays = WEEK_ORDER.filter(day =>
    weeks.some(w => w.days && w.days[day] && w.days[day].pairs.some(Boolean))
  );
  if (!usedDays.length) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">Нет занятий в расписании этой группы</div>`;
    return;
  }

  // Определим максимальное количество пар среди дней (обычно 7)
  let maxPairs = 0;
  usedDays.forEach(day => {
    weeks.forEach(w => {
      const arr = (w.days?.[day]?.pairs) || [];
      maxPairs = Math.max(maxPairs, arr.length);
    });
  });
  if (maxPairs < 1) maxPairs = 7;

  // Шапка таблицы
  let html = '<div class="tbl-wrap"><table class="zach-table"><thead>';

  // Строка 1: «День недели / №» + по 3 колонки на каждую неделю (дата)
  html += '<tr class="dates">';
  html += `<th class="num" rowspan="2">№</th>`;
  html += `<th rowspan="2">День</th>`;
  weeks.forEach(w => {
    html += `<th colspan="3">${esc(w.dateStr || "дата не указана")}</th>`;
  });
  html += "</tr>";

  // Строка 2: у каждой недели — 3 подколонки
  html += '<tr class="cols">';
  weeks.forEach(() => {
    html += `<th>Предмет</th><th>Преподаватель</th><th>Каб.</th>`;
  });
  html += "</tr>";
  html += "</thead><tbody>";

  // Тело: дни по порядку
  usedDays.forEach(day => {
    // Определим, есть ли хоть что-то в этом дне
    const anyData = weeks.some(w => (w.days?.[day]?.pairs || []).some(p => p && (p.subj || p.prep || p.kab)));
    if (!anyData) return;

    // Строка-разделитель с названием дня (colspan)
    const totalCols = 2 + weeks.length * 3;
    html += `<tr><td class="day-row" colspan="${totalCols}">${DAYS_RU[day] || day}</td></tr>`;

    // Строки пар
    for (let p = 0; p < maxPairs; p++) {
      html += "<tr>";
      html += `<td class="num">${p + 1}</td>`;
      html += `<td></td>`; // колонка "День" — пустая (название дня выше)
      weeks.forEach(w => {
        const pair = (w.days?.[day]?.pairs?.[p]) || null;
        const subj = pair?.subj || "";
        const prep = pair?.prep || "";
        const kab  = pair?.kab  || "";
        html += `<td>${subj ? esc(subj) : '<span class="muted">—</span>'}</td>`;
        html += `<td>${prep ? esc(prep) : '<span class="muted">—</span>'}</td>`;
        html += `<td class="kab">${kab ? esc(kab) : '<span class="muted">—</span>'}</td>`;
      });
      html += "</tr>";
    }
  });

  html += "</tbody></table></div>";
  document.getElementById("zachTableBox").innerHTML = html;
}

function showZach() {
  const tabsBox = document.getElementById("zachTabs");
  tabsBox.innerHTML = "";

  if (!zachGroups.length) {
    document.getElementById("zachTableBox").innerHTML =
      `<div class="msg">Файл ${ZACH_FILE} не найден или пуст</div>`;
    document.getElementById("zachSubtitle").textContent = "";
    show("view-zach");
    return;
  }

  zachGroups.forEach((g, i) => {
    const tab = document.createElement("button");
    tab.className = "zach-tab";
    tab.textContent = g.tab;
    tab.onclick = () => renderZachTable(i);
    tabsBox.appendChild(tab);
  });

  renderZachTable(0);
  show("view-zach");
}

/* ============ прочее ============ */
function showDays() { show("view-days"); }

/* ============ старт ============ */
Promise.all([loadFile(), loadZachFile()])
  .then(() => renderDays())
  .catch(e => {
    document.getElementById("fileInfo").textContent = "Ошибка: " + e.message;
    renderDays();
  });
</script>
